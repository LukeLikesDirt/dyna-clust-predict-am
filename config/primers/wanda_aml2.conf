# Primer config: WANDA / AML2
# Targets the ~440-540bp SSU V4 fragment. This is the original primer pair
# this pipeline was built around; values below reproduce the pre-refactor
# 01_prepare_euk_V4.sh exactly.

PRIMER_SET_NAME="wanda_aml2"

# Human-readable label (forward name–reverse name). 03_combine_cutoffs.R
# splits this on the en dash to build the primer_string column, so keep the
# order "<forward name>–<reverse name>".
PRIMER_LABEL="WANDA–AML2"

# WANDA 5' forward primer and AML2 3' reverse primer (reverse complement)
PRIMER_FWD="CAGCCGCGGTAATTCCAGCT"
PRIMER_REV="GGAAACCAAAGTGTTTGGGTTC"

# Cutadapt linked-primer trim (full-length reads with both primers)
MIN_OVERLAP_FWD=20
MIN_OVERLAP_REV=22
MAX_ERROR_FWD=2
MAX_ERROR_REV=4

# Amplicon length window: filters trimmed full reads to a plausible size,
# and is the truncation length for "too long" reads folded into the partial
# (forward-primer-only) dataset.
MIN_LEN=440
MAX_LEN=540
TRUNCATION_LEN=540
MAX_N=0

# Degenerate forward primer (derived from trimmed reads, applied to
# untrimmed reads to recover partial/forward-only coverage)
FWD_CONSENSUS_LEN=15
FWD_THRESHOLD=0.25
