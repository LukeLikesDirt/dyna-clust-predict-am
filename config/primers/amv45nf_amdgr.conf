# Primer config: AMV4.5NF / AMDGR
# Targets a shorter ~150-280bp fragment nested within the WANDA/AML2 SSU V4
# region. This is the primer pair used by the "molly" project.
#
# Length window calibrated empirically (2026-08-27) by extracting
# AMV4.5NF/AMDGR from the already-WANDA/AML2-trimmed reference: Glomeromycota
# came out 203-231bp (median 216, 99.6% of input extracted), Endogonomycetes
# 213-224bp (92.2% extracted). MIN_LEN/MAX_LEN below give margin around that
# range for the full (untrimmed-by-WANDA) extraction this config is actually
# used for -- adjust here if the real run's length distribution warrants it.

PRIMER_SET_NAME="amv45nf_amdgr"

# Human-readable label (forward name–reverse name). 03_combine_cutoffs.R
# splits this on the en dash to build the primer_string column, so keep the
# order "<forward name>–<reverse name>".
PRIMER_LABEL="AMV4.5NF–AMDGR"

# AMV4.5NF forward primer and AMDGR 3' reverse primer (reverse complement)
PRIMER_FWD="AAGCTCGTAGTTGAATTTCG"
PRIMER_REV="ATGATTAATAGGGATAGTTGGG"

# Cutadapt linked-primer trim (full-length reads with both primers)
MIN_OVERLAP_FWD=18
MIN_OVERLAP_REV=20
MAX_ERROR_FWD=2
MAX_ERROR_REV=4

# Amplicon length window: filters trimmed full reads to a plausible size,
# and is the truncation length for "too long" reads folded into the partial
# (forward-primer-only) dataset.
MIN_LEN=150
MAX_LEN=280
TRUNCATION_LEN=280
MAX_N=0

# Degenerate forward primer (derived from trimmed reads, applied to
# untrimmed reads to recover partial/forward-only coverage)
FWD_CONSENSUS_LEN=15
FWD_THRESHOLD=0.25
