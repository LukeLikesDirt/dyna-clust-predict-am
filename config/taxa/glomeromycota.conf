# Taxon config: Glomeromycota
# Column numbers refer to the *_full.classification header:
#   1=id 2=kingdom 3=phylum 4=class 5=order 6=family 7=genus 8=species

TAXON_PREFIX="glomeromycota"
TAXON_LABEL="Glomeromycota"
TAXON_FILTER_COL=3            # phylum
TAXON_FILTER_VALUE="Glomeromycota"

RANKS=("order" "family" "genus" "species")

# Search floor for the pairwise similarity matrix (.sim only stores pairs
# >= this) and the starting threshold cutoff prediction scans up from.
MIN_SIM=0.9
START_THRESH=0.9

# Downsampling (F-measure prediction can be dominated by one over-represented
# taxon; downsample_dominant() caps it at this proportion of the rank subset)
MAX_PROPORTION=0.5
DOWNSAMPLE_RANKS=("family")
SEED=1986

# Which rank's fasta the one master (reused-across-ranks) sim matrix is
# built from. Empty CASCADE_BASE_RANK = every rank subset is filtered
# directly from the TAXON_FILTER_VALUE-matched "all" set (Glomeromycota is
# already a narrow, well-identified group -- no intermediate base needed).
SIM_BASE_RANK="order"
CASCADE_BASE_RANK=""
