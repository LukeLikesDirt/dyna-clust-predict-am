# Taxon config: Fungi (kingdom)
# Column numbers refer to the *_full.classification header:
#   1=id 2=kingdom 3=phylum 4=class 5=order 6=family 7=genus 8=species

TAXON_PREFIX="fungi"
TAXON_LABEL="Fungi"
TAXON_FILTER_COL=2             # kingdom
TAXON_FILTER_VALUE="Fungi"

RANKS=("phylum" "class" "order" "family" "genus" "species")

MIN_SIM=0.8
START_THRESH=0.8

MAX_PROPORTION=0.5
DOWNSAMPLE_RANKS=("family")
SEED=1986

SIM_BASE_RANK="phylum"
# Fungi spans far more diversity than Glomeromycota/Endogonomycetes, so each
# rank subset below phylum is derived from a phylum-IDENTIFIED base (built
# once) rather than directly from the raw kingdom-filtered "all" set --
# matches the original 04_predict_fun_cutoffs_V4.sh behaviour.
CASCADE_BASE_RANK="phylum"
