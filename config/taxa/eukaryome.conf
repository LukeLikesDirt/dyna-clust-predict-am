# Taxon config: Eukaryome (global, all kingdoms)
# Consumed by scripts/03_predict_euk_cutoffs.sh, NOT 02_predict_cutoffs.sh --
# the global algorithm (R/subset.R balanced sampling, one sim matrix per
# rank) is different enough from the taxon-column-filter approach that it
# has its own config shape (no TAXON_FILTER_COL/VALUE, SIM_BASE_RANK, or
# CASCADE_BASE_RANK -- those are 02_predict_cutoffs.sh-specific).

TAXON_PREFIX="eukaryome"
TAXON_LABEL="Eukaryome"

RANKS=("family" "genus" "species")

# Search floor for each rank's similarity matrix, and the starting
# threshold cutoff prediction scans up from.
MIN_SIM=0.8
START_THRESH=0.8

# subset.R's nested-filter and global-budget-allocation parameters.
MIN_SUBGROUPS=10
MIN_SEQUENCES=30
MAX_PROPORTION=0.5
SEED=1986

# Sequence cap for the balanced subsample subset.R builds per rank (applied
# twice: once when generating global ID lists, once as a hard cap before
# prediction if that list is still oversized). All-vs-all is infeasible at
# full eukaryome scale (tens of thousands of sequences per primer set), so
# every rank gets a capped, taxonomically-balanced subsample instead of the
# full identified set.
MAX_SEQUENCES_IDS=10000
MAX_SEQUENCES_PRED=10000
